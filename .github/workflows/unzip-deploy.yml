name: Unzip and Deploy LSA Post

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Unzip post archive
        run: unzip -o ringback-lsa-post.zip
      - name: Remove ZIP
        run: rm ringback-lsa-post.zip
      - name: Commit extracted files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Publish LSA post: LSA pay-per-lead terms, Brown Friday, guides, sitemap"
