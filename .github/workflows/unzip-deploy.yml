name: Unzip and Deploy Winner Post

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Unzip winner post
        run: unzip -o ringback-winner-post.zip
      - name: Remove ZIP
        run: rm ringback-winner-post.zip
      - name: Commit extracted files
        run: |
          git config user.name "blogmsite"
          git config user.email "blogmsite@users.noreply.github.com"
          git add -A
          git commit -m "Publish winner post: November 2026 rule changes, guides, sitemap, homepage meta" || echo "nothing to commit"
          git push
