name: Unzip deploy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Christmas post
        run: unzip -o ringback-christmas-post.zip
      - name: Commit extracted files and remove ZIP
        run: |
          rm -f ringback-christmas-post.zip
          git config user.name "blogmsite"
          git config user.email "blogmsite@users.noreply.github.com"
          git add -A
          git commit -m "Publish Christmas post: three phone changes, guides, sitemap"
          git push
