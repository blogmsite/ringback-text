name: Unzip and Deploy AdSense Verification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Unzip post archive
        run: unzip -o ringback-adsense-verify.zip
      - name: Remove ZIP
        run: rm ringback-adsense-verify.zip
      - name: Commit extracted files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add AdSense verification code and ads.txt"
