name: Unzip and deploy duplicate-tags fix

on:
  push:
    branches: [main]
    paths:
      - 'ringback-dedup-fix.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip duplicate-tags fix
        run: unzip -o ringback-dedup-fix.zip
      - name: Commit extracted files
        run: |
          rm -f ringback-dedup-fix.zip
          git config user.name "blogmsite"
          git config user.email "blogmsite@users.noreply.github.com"
          git add -A
          git commit -m "Fix duplicate head tags: 14 posts de-duplicated, homepage og:url added" || echo "Nothing to commit"
          git push
