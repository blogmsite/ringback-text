name: Publish content zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract content
        run: |
          unzip -o ringback-combined-deploy.zip
          rm ringback-combined-deploy.zip
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Publish combined content: 5 new blog posts, Latest guides, sitemap" || echo "nothing to commit"
          git push
