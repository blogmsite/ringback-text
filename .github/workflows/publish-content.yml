name: Publish content zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract content
        run: |
          unzip -o ringback-link-fix.zip
          rm ringback-link-fix.zip
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Publish link fix: Twilio footer link and about meta description" || echo "nothing to commit"
          git push
