name: Publish content zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract content
        run: |
          unzip -o ringback-adsense-content.zip
          rm ringback-adsense-content.zip
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Publish AdSense content: 20 blog posts, guides, privacy, about, contact, sitemap" || echo "nothing to commit"
          git push
